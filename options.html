<!DOCTYPE html>
<!-- 文案全部来自 _locales，由 options.js 在加载时填入；这里只留结构。
     lang 也会被改成实际界面语言。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SSO Account Pin</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <!-- 图钉：对应扩展名里的 "Pin"。内联 SVG，不引外部资源 -->
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
          </svg>
        </span>
        <div>
          <h1 data-i18n="appTitle"></h1>
          <p class="lede" data-i18n="lede"></p>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="sso"
                aria-controls="panel-sso" aria-selected="true" data-i18n="tabSso"></button>
        <button type="button" role="tab" data-tab="accounts"
                aria-controls="panel-accounts" aria-selected="false" data-i18n="tabAccounts"></button>
        <button type="button" role="tab" data-tab="backup"
                aria-controls="panel-backup" aria-selected="false" data-i18n="tabBackup"></button>
        <button type="button" role="tab" data-tab="diag"
                aria-controls="panel-diag" aria-selected="false" data-i18n="tabDiag"></button>
      </nav>

      <section class="card">
        <!-- 两个配置面板共用一个 form：保存时要一次性申请所有域名的 host 权限，
             拆成两个表单就得让用户授权两次。备份和诊断没有可保存的东西，放在
             form 外面，保存栏也随之隐藏。 -->
        <form id="settings-form">
          <div class="panel" id="panel-sso" role="tabpanel">
            <section>
              <label for="email" data-i18n="emailLabel"></label>
              <input
                id="email"
                type="email"
                placeholder="you@your-company.com"
                autocomplete="off"
              />
              <p class="hint" data-i18n="emailHint"></p>
            </section>

            <section>
              <label for="domains" data-i18n="domainsLabel"></label>
              <textarea
                id="domains"
                rows="6"
                placeholder="your-company.com&#10;your-company.cn&#10;your-product.com"
              ></textarea>
              <p class="hint" data-i18n="domainsHint"></p>
            </section>

            <section class="row">
              <label class="checkbox">
                <input id="use-authuser" type="checkbox" />
                <span data-i18n="authuserCheckbox"></span>
              </label>
              <input id="authuser" type="text" inputmode="numeric" placeholder="1" size="4" />
              <p class="hint" data-i18n="authuserHint"></p>
            </section>
          </div>

          <div class="panel" id="panel-accounts" role="tabpanel" hidden>
            <section>
              <p class="hint" data-i18n="accountsIntro"></p>
              <div id="account-groups"></div>
              <p class="hint empty-note" id="accounts-empty" data-i18n="accountsEmpty"></p>
              <p class="actions">
                <button type="button" class="ghost" id="add-group" data-i18n="addGroupButton"></button>
              </p>
            </section>
          </div>

          <footer id="save-bar">
            <button type="submit" data-i18n="saveButton"></button>
            <span id="status" role="status"></span>
          </footer>
        </form>

        <div class="panel" id="panel-backup" role="tabpanel" hidden>
          <section>
            <p class="hint" data-i18n="backupHint"></p>
            <p class="actions">
              <button type="button" class="ghost" id="export-config" data-i18n="exportButton"></button>
              <button type="button" class="ghost" id="import-config" data-i18n="importButton"></button>
              <input id="import-file" type="file" accept="application/json,.json" hidden />
              <span id="backup-status" role="status"></span>
            </p>
          </section>
        </div>

        <div class="panel" id="panel-diag" role="tabpanel" hidden>
          <section>
            <p class="hint" data-i18n="diagnosticsHint"></p>
            <p class="actions">
              <button type="button" class="ghost" id="check-matches" data-i18n="checkMatchesButton"></button>
              <span id="diag-status" role="status"></span>
            </p>
            <pre id="matched-dump" hidden></pre>
          </section>

          <section id="active-rules" hidden>
            <h2 data-i18n="activeRulesTitle"></h2>
            <pre id="rules-dump"></pre>
          </section>
        </div>
      </section>
    </main>

    <!-- 一组账号绑定。label 包着 input，省掉动态生成 id 的麻烦。 -->
    <template id="account-group-template">
      <section class="group">
        <div class="group-head">
          <span class="group-index"></span>
          <button type="button" class="ghost remove-group" data-i18n="removeGroupButton"></button>
        </div>
        <label class="field">
          <span data-i18n="groupEmailLabel"></span>
          <input type="email" class="group-email" placeholder="you@your-company.com" autocomplete="off" />
        </label>
        <label class="field">
          <span data-i18n="groupDomainsLabel"></span>
          <textarea class="group-domains" rows="3" placeholder="meet.google.com&#10;calendar.google.com"></textarea>
        </label>
      </section>
    </template>

    <script type="module" src="options.js"></script>
  </body>
</html>
